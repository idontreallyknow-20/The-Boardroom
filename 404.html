a.btn:hover { background: #143061; }

footer { padding: 24px 20px 28px; font-size: 12px; color: var(--ink-3); }
footer a { color: var(--navy); text-decoration: none; border-bottom: 1px solid var(--hair); }
footer a:hover { border-bottom-color: var(--navy); }
